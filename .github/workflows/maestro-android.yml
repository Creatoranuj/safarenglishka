name: Maestro Android E2E

# Real-device-style end-to-end smoke on an Android emulator using Maestro.
# Manual dispatch only. The nightly cron was removed: shared-runner qemu dies
# mid-flow often enough (runs #54-#65) that a scheduled run mostly produced
# infra noise nobody triaged, and a red badge people learned to ignore is
# worse than no badge. Run it on demand before a release.
#
# Requires GitHub repo secrets (already configured):
#   MAESTRO_EMAIL, MAESTRO_PASSWORD  — dedicated STUDENT account, never admin
#                                      (this job uploads screenshots + hierarchies)
#
# Flow order (see maestro/smoke.yaml — it is only a composition):
#   login.yaml (gate) -> nav.yaml (gate) -> pdf-back / back-button (advisory)

on:
  workflow_dispatch:
    inputs:
      gate:
        description: 'Fail the job when the smoke gates fail'
        type: boolean
        default: true

concurrency:
  group: maestro-${{ github.ref }}
  cancel-in-progress: true

# Single source of truth for the JDK across every Android workflow.
# Capacitor 6+ plugins compile against Java 21 (see android/app/capacitor.build.gradle
# — sourceCompatibility/targetCompatibility VERSION_21). Bumping in one place
# prevents the "invalid source release: 21" drift that failed maestro run #1.
env:
  JAVA_VERSION: '21'
  # Pin the driver. An unpinned `get.maestro.mobile.dev` install means an
  # upstream driver change can turn the gate red overnight with no repo change.
  MAESTRO_VERSION: '2.6.1'

jobs:
  android-e2e:
    # Ubuntu, not macOS. GitHub-hosted macos-14 runners are Apple Silicon and
    # do NOT expose the hypervisor to the Android emulator — run #45 died with
    # "HVF error: HV_UNSUPPORTD" then "Timeout waiting for emulator to boot",
    # and the x86_64 image on run #44 never started either. GitHub-hosted Linux
    # runners now ship KVM (enabled by the udev rule below), which is the only
    # working accelerator for this emulator today.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1


      # Secrets guard. Run #51 submitted an empty login form because the env
      # vars were empty, and the failure surfaced 120s later as a dashboard
      # assertion. Fail in 1s with a message that names the missing secret.
      - name: 🔐 Verify Maestro credentials are configured
        env:
          MAESTRO_EMAIL: ${{ secrets.MAESTRO_EMAIL }}
          MAESTRO_PASSWORD: ${{ secrets.MAESTRO_PASSWORD }}
        run: |
          set -e
          missing=""
          [ -n "$MAESTRO_EMAIL" ] || missing="$missing MAESTRO_EMAIL"
          [ -n "$MAESTRO_PASSWORD" ] || missing="$missing MAESTRO_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secret(s):$missing — the login gate cannot run. Add them in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Both Maestro credentials are present."

      - name: 🧩 Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm


      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.18'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 📦 Install deps
        run: bun install --frozen-lockfile --ignore-scripts

      # Parse every flow before spending 15 minutes on an emulator. A YAML type
      # used to surface only after the boot, install and login had run.
      - name: ✅ Validate Maestro flows
        run: |
          set -e
          for f in maestro/*.yaml maestro/split-smoke/*.yaml; do
            bunx js-yaml "$f" > /dev/null && echo "ok  $f"
          done

      - name: 🏗️ Build web assets
        env:
          # Maestro's `androidWebViewHierarchy: devtools` reads the DOM over the
          # WebView remote-debugging protocol. capacitor.config.ts only enables
          # `webContentsDebuggingEnabled` when CAP_DEBUG=1, so without this the
          # devtools hierarchy is empty and every assertion fails "is visible"
          # (runs #66 and #71 died exactly there, on a healthy emulator).
          # E2E debug APK only — release builds never set this.
          CAP_DEBUG: '1'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: bun run build

      - name: 🔁 Cap sync
        # cap sync bakes capacitor.config.ts into android assets — CAP_DEBUG must
        # be present HERE too or the copied config keeps debugging disabled.
        env:
          CAP_DEBUG: '1'
        run: bunx cap sync android

      # `gradlew` loses its executable bit on a fresh checkout (core.fileMode),
      # which failed maestro run #43 in 46s with "./gradlew: Permission denied"
      # before the emulator ever booted.
      #
      # ANDROID_ABI_FILTERS: the release default is arm64-v8a/armeabi-v7a, so
      # the debug APK carried no x86_64 native libs and run #46 died with
      # INSTALL_FAILED_NO_MATCHING_ABIS on the (x86_64) emulator. build.gradle
      # honours this env var — include x86_64 for the emulator build only.
      - name: 🏗️ Build debug APK
        working-directory: android
        env:
          ANDROID_ABI_FILTERS: x86_64,arm64-v8a
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon



      # Runs #54 and #58 both ended with the emulator PROCESS gone, not the
      # driver: "device 'emulator-5554' not found" and then "could not connect
      # to TCP port 5554: Connection refused". That is a host-side kill, so
      # record the host's memory picture before we launch qemu.
      - name: 🩺 Host resources before emulator
        run: |
          free -m
          nproc
          df -h /

      - name: 📥 Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | MAESTRO_VERSION="${MAESTRO_VERSION}" bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: 🤖 Run Android emulator + Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          # google_apis ships the full Google app suite. Run #53's logcat shows
          # com.google.android.apps.maps:server_recovery_process crash-looping
          # hundreds of times per second, starving the CPU until our own
          # MainActivity ANR'd ("Waited 5001ms for FocusEvent") and was force
          # finished — the flow then ran against the launcher. google_atd is
          # the stripped Automated Test Device image: Play services, no bundled
          # Maps/Photos/YouTube, and it is the image Google ships for CI.
          target: google_atd
          # x86_64 + KVM on ubuntu-latest. arm64-v8a was tried on macos-14 and
          # failed with HVF error: HV_UNSUPPORTED (run #45).
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 900
          # RAM GGb (runs #49/#50 died on system-wide ANR dialogs with the
          # landing page already painted behind them). Cores stay at 2:
          # ubuntu-latest only has 4, and handing the emulator all of them in
          # run #54 starved the host.
          #
          # -gpu swiftshader_indirect, NOT -gpu guest.
          #
          # Runs #63/#64 died with
          #   java.io.IOException: Command failed (host:transport:emulator-5554):
          #   device 'emulator-5554' not found
          # on Maestro's ADB pool thread — i.e. the qemu PROCESS vanished, not
          # the driver. The `-gpu guest` switch introduced in run #60 is the
          # cause, not the cure: `google_atd` is Google's Automated Test Device
          # image and it ships WITHOUT a guest GPU/graphics stack, so guest-side
          # rasterisation has nothing to run on. Google documents ATD images as
          # swiftshader_indirect-only. Pairing ATD with -gpu guest is an
          # unsupported combination and aborts qemu the moment the WebView
          # starts composing — which is exactly ~95s in, right after login.
          #
          # The original swiftshader crash is addressed properly below instead,
          # by taking the WebView off GL entirely (webview-command-line), so the
          # host renderer is never asked to translate them — removing the exact
          # fault that killed qemu ~95s into every run. Costs a few fps we do not
          # care about headless.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-snapshot-save -no-metrics -camera-back none -camera-front none -memory 4096 -cores 2

          # NOTE: this runner executes the script under /usr/bin/sh (dash) and
          # each line in its own `sh -c`. Never use `set -o pipefail` (dash
          # aborts on line 1)"never rely on `export` surviving to the next
          # line (run #51 proved it does not) — interpolate secrets inline.
          script: |
            set -e
            # Suppress ANR/crash dialogs at the OS level. Tapping "Wait" from
            # the flow is not enough — the dialog reappears for whichever
            # process stalls next, and any dialog makes every text assertion
            # in the flow false (runs #49/#50).
            adb shell settings put global hide_error_dialogs 1
            adb shell settings put secure anr_show_background 0 || true
            # Run #52 hung 120s inside `inputText` and killed the gRPC channel
            # (DeviceServerDiedException / DEADTINE_EXCEEDED). The Gboard IME
            # animating over a WebView field is the usual culpret on a
            # software-GPU emulator; Maestro injects text through its own IME,
            # so switching Gboard off removes the race with out losing input.
            adb shell settings put secure show_ime_with_hard_keyboard 0 || true
            adb shell ime disable com.google.android.inputmethod.latin || true


            # ── THE FIX for "device 'emulator-5554' not found" ──
            # Chromium reads /data/local/tmp/webview-command-line at WebView
            # startup (first token is an ignored argv[0] placeholder). Forcing
            # software rendering means the WebView never issues GL calls, so
            # the emulator's swiftshader host renderer is never asked to
            # translate them — removing the exact fault that killed qemu ~~95s
            # into every run. Costs a few fps we do not care about headless.
            # Run #72 survived the full 8 minutes (no qemu death) but every
            # screenshot was pure black and the devtools hierarchy empty, so the
            # renderer fix worked and the *compositor* is now the problem.
            # `--in-process-gpu` + `--num-raster-threads=1` are the two flags
            # known to hand back a black SurfaceView on swiftshader; drop them
            # and keep only the GL-avoidance flags.
            adb shell "echo '_ --disable-gpu --disable-gpu-compositing --disable-gpu-rasterization --disable-accelerated-2d-canvas' > /data/local/tmp/webview-command-line"
            adb shell chmod 664 /data/local/tmp/webview-command-line || true
            echo "webview flags: $(adb shell cat /data/local/tmp/webview-command-line)"

            adb install -r android/app/build/outputs/apk/debug/app-debug.apk

            # First-paint probe. Cheap (one cold launch) and it is the only way
            # to tell "WebView painted nothing" from "the app crashed on boot" —
            # run #72's black screenshot is ambiguous without logcat.
            adb logcat -c || true
            adb shell am start -n com.safarenglishka.app/.MainActivity || true
            sleep 25
            adb exec-out screencap -p > "$HOME/first-launch.png" || true
            adb logcat -d -v time > "$HOME/logcat-first-launch.txt" 2>&1 || true
            echo "--- chromium/app lines ---"
            grep -iE "chromium|cr_|capacitor|safarenglishka|FATAL|AndroidRuntime" "$HOME/logcat-first-launch.txt" | tail -60 || true
            adb shell am force-stop com.safarenglishka.app || true


            # Prove the device is actually reachable before Maestro opens its
            # gRPC session. If qemu already died, fail HERE with a clear
            # message instead of 90s later inside an ADB pool thread.
            adb reconnect offline || true
            adb wait-for-device
            adb shell getprop sys.boot_completed

            # Sample host memory every 5s for the length of the flow. If qemu
            # is being OOM-killed this file shows available memory collapsing
            # just before the "device not found" error.
            (while true; do echo "$(date -u +%H:%M:%S) $(free -m | awk '/^Mem:/{print "used="$3" avail="$7}')"; sleep 5; done) > "$HOME/host-mem.log" 2>&1 &

            # NO diagnostic app launches before the gate. Run #64 spent ~3
            # extra minutes launching the app twice just to dump hierarchies,
            # and qemu then died 95s into the real flow ("device 'emulator-5554'
            # not found" → "Android driver unreachable"), exactly like runs
            # #54/#58/#59. Every extra WebView launch is another chance for the
            # emulator's renderer to take the process down, so the gate now runs
            # on a cold, otherwise-untouched emulator.
            #
            # The dump those steps existed for is already captured in run #64's
            # log and encoded in maestro/login.yaml: the login inputs DO expose
            # resource-id "email"/"password" and hintText
            # "Email Address you@example.com" / "Password ••••••••".
            # hierarchy-final.txt below still runs after the gate for triage.



            # Single gate, single Maestro session: smoke.yaml composes
            # login.yaml + nav.yaml with runFlow. Run #62 ran them as two
            # separate `maestro test` processes — login passed (55s) and nav
            # then failed in 2s with no reason, because the second process does
            # not inherit the first one's app/session state. runFlow keeps both
            # gates in one session while junit still reports them separately.
            #
            # One retry: the emulator's gRPC driver dies mid-flow on shared
            # runners (run #56: DeviceServerDiedException on 'viewHierarchy').
            # That is infrastructure, not a product regression. A real failure
            # still fails twice and gates.
            # ONE LINE. android-emulator-runner executes every script line as
            # its own `sh -c`, so backslash continuations are split apart and
            # die instantly (run #63 failed in 1.4s on exactly that).
            maestro test --env MAESTRO_EMAIL='${{ secrets.MAESTRO_EMAIL }}' --env MAESTRO_PASSWORD='${{ secrets.MAESTRO_PASSWORD }}' maestro/smoke.yaml --format junit --output maestro-report.xml || { echo '--- junit (attempt 1) ---'; cat maestro-report.xml || true; adb reconnect offline || true; adb wait-for-device; adb shell am force-stop com.safarenglishka.app || true; maestro test --env MAESTRO_EMAIL='${{ secrets.MAESTRO_EMAIL }}' --env MAESTRO_PASSWORD='${{ secrets.MAESTRO_PASSWORD }}' maestro/smoke.yaml --format junit --output maestro-report.xml; }

            echo '--- junit (final) ---'
            cat maestro-report.xml || true

            # Post-failure/success hierarchy snapshot for the artifact.
            maestro hierarchy > "$HOME/hierarchy-final.txt" 2>&1 || true

            # Secondary flows stay non-blocking — they cover optional paths
            # (pdf viewer back-nav, cold-start deep link) that flake on cold
            # emulators but shouldn't gate release.
            # Stop the sappler and surface the tail inline, so triage does not
            # need the artifact for the common case.
            kill %1 2>/dev/null || true
            tail -20 "$HOME/host-mem.log" || true

            maestro test maestro/pdf-back.yaml || true
            maestro test maestro/back-button-cold-start.yaml || true

      - name: 📤 Upload Maestro report + screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: maestro-report
          path: |
            maestro-report.xml
            ~/host-mem.log
            ~/hierarchy-final.txt
            ~/first-launch.png
            ~/logcat-first-launch.txt
            ~/.maestro/tests/**/*
          retention-days: 14
          if-no-files-found: ignore

      - name: 🩺 OOM evidence (on failure)
        if: failure()
        run: |
          free -m
          echo "--- kernel OOM kills ---"
          sudo dmesg -T 2>/dev/null | grep -iE "killed process|out of memory|oom-kill" | tail -20 || echo "none"
          echo "--- host memory samples ---"
          tail -40 "$HOME/host-mem.log" 2>/dev/null || echo "no samples"
          echo "--- final hierarchy (first 80 lines) ---"
          head -80 "$HOME/hierarchy-final.txt" 2>/dev/null || echo "no hierarchy dump"

      # On any failure (typically a pre-Maestro gradle compile error, as in
      # run #1), grab gradle's build reports + logs so the next triage pass
      # can jump straight to the failing task instead of scrolling logs.
      - name: 📤 Upload gradle build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: gradle-build-reports
          path: |
            android/**/build/reports/**/*
            android/**/build/outputs/logs/**/*
          retention-days: 7
          if-no-files-found: ignore
