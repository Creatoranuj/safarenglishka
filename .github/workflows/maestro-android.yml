name: Maestro Android E2E

# Real-device-style end-to-end smoke on an Android emulator using Maestro.
# Manual-dispatch only (emulator boots are slow ~10-15 min) plus optional
# nightly cron. Builds a debug APK, boots an emulator, installs the APK,
# then runs `maestro/*.yaml` flows.
#
# Requires GitHub repo secrets (already configured):
#   MAESTRO_EMAIL, MAESTRO_PASSWORD

on:
  workflow_dispatch:
  schedule:
    # Nightly 04:30 UTC — off-peak so it doesn't fight with release builds
    - cron: '30 4 * * *'

concurrency:
  group: maestro-${{ github.ref }}
  cancel-in-progress: true

# Single source of truth for the JDK across every Android workflow.
# Capacitor 6+ plugins compile against Java 21 (see android/app/capacitor.build.gradle
# — sourceCompatibility/targetCompatibility VERSION_21). Bumping in one place
# prevents the "invalid source release: 21" drift that failed maestro run #1.
env:
  JAVA_VERSION: '21'

jobs:
  android-e2e:
    # Ubuntu, not macOS. GitHub-hosted macos-14 runners are Apple Silicon and
    # do NOT expose the hypervisor to the Android emulator — run #45 died with
    # "HVF error: HV_UNSUPPORTED" then "Timeout waiting for emulator to boot",
    # and the x86_64 image on run #44 never started either. GitHub-hosted Linux
    # runners now ship KVM (enabled by the udev rule below), which is the only
    # working accelerator for this emulator today.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 🧩 Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm


      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.18'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 📦 Install deps
        run: bun install --frozen-lockfile --ignore-scripts

      - name: 🏗️ Build web assets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: bun run build

      - name: 🔁 Cap sync
        run: bunx cap sync android

      # `gradlew` loses its executable bit on a fresh checkout (core.fileMode),
      # which failed maestro run #43 in 46s with "./gradlew: Permission denied"
      # before the emulator ever booted.
      #
      # ANDROID_ABI_FILTERS: the release default is arm64-v8a/armeabi-v7a, so
      # the debug APK carried no x86_64 native libs and run #46 died with
      # INSTALL_FAILED_NO_MATCHING_ABIS on the (x86_64) emulator. build.gradle
      # honours this env var — include x86_64 for the emulator build only.
      - name: 🏗️ Build debug APK
        working-directory: android
        env:
          ANDROID_ABI_FILTERS: x86_64,arm64-v8a
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon



      - name: 📥 Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: 🤖 Run Android emulator + Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          # x86_64 + KVM on ubuntu-latest. arm64-v8a was tried on macos-14 and
          # failed with HVF error: HV_UNSUPPORTED (run #45).
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 900
          # -memory/-cores raised from the 2048MB/2-core default: runs #49 and
          # #50 both died on system-wide ANR dialogs ("Safar English isn't
          # responding", then "Pixel Launcher isn't responding") while the
          # landing page was already painted behind them. The emulator was
          # simply starved on a software GPU.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 6144 -cores 4

          script: |
            set -e
            # Suppress ANR/crash dialogs at the OS level. Tapping "Wait" from
            # the flow is not enough — the dialog reappears for whichever
            # process stalls next, and any dialog makes every text assertion
            # in the flow false (runs #49/#50).
            adb shell settings put global hide_error_dialogs 1
            adb shell settings put secure anr_show_background 0 || true
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            # DO NOT `export` here and reference $VAR below: this runner
            # executes each script line as its own `/usr/bin/sh -c`, so exports
            # never survive to the next line. Run #51's log proves it — the
            # export lines ran, then `maestro test --env MAESTRO_EMAIL=""`
            # submitted an empty form and the login screen answered "Please
            # fill in all fields". Interpolate the secrets into the one command
            # that needs them.
            # Smoke is the gate — it must fail the job when it fails. The
            # previous `|| echo "smoke failed"` swallowed real regressions and
            # let the job report green while login/dashboard were broken.
            maestro test --env MAESTRO_EMAIL='${{ secrets.MAESTRO_EMAIL }}' --env MAESTRO_PASSWORD='${{ secrets.MAESTRO_PASSWORD }}' maestro/smoke.yaml --format junit --output maestro-report.xml

            # Secondary flows stay non-blocking — they cover optional paths
            # (pdf viewer back-nav, cold-start deep link) that flake on cold
            # emulators but shouldn't gate release.
            maestro test maestro/pdf-back.yaml || true
            maestro test maestro/back-button-cold-start.yaml || true

      - name: 📤 Upload Maestro report + screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: maestro-report
          path: |
            maestro-report.xml
            ~/.maestro/tests/**/*
          retention-days: 14
          if-no-files-found: ignore

      # On any failure (typically a pre-Maestro gradle compile error, as in
      # run #1), grab gradle's build reports + logs so the next triage pass
      # can jump straight to the failing task instead of scrolling logs.
      - name: 📤 Upload gradle build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: gradle-build-reports
          path: |
            android/**/build/reports/**/*
            android/**/build/outputs/logs/**/*
          retention-days: 7
          if-no-files-found: ignore
