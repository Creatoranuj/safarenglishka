name: Supabase Keepalive

# Prevents free-tier 7-day inactivity auto-pause by hitting the project
# with a harmless, RLS-independent read-only health check every 5 days.

on:
  schedule:
    - cron: '0 3 */5 * *'   # every 5 days at 03:00 UTC (max gap ~5 days, well inside 7-day window)
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # needed only to open an alert issue if the ping fails

jobs:
  ping:
    name: Ping Supabase (read-only health check)
    runs-on: ubuntu-latest
    steps:
      - name: Read-only keepalive query
        id: ping
        run: |
          BASE="${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}"
          ANON_KEY="${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}"
          if [ -z "$BASE" ] || [ -z "$ANON_KEY" ]; then
            echo "::error::Missing SUPABASE_URL/VITE_SUPABASE_URL or SUPABASE_ANON_KEY/VITE_SUPABASE_ANON_KEY repo secret"
            exit 1
          fi
          # PostgREST root (`/rest/v1/`) used to answer 200 for any valid anon
          # key, but managed Supabase now rejects it with
          #   401 "Only the `service_role` API key can be used for this endpoint"
          # which made this workflow open a false-alarm issue every 5 days.
          # A narrow anon-readable SELECT is the correct probe: it touches the
          # database (which is what actually resets the inactivity timer) and
          # needs no privileged key. `/auth/v1/settings` is the fallback — it
          # keeps the project warm even if the table is renamed.
          probe() {
            curl -s -o /tmp/resp.json -w "%{http_code}" \
              -H "apikey: $ANON_KEY" \
              -H "Authorization: Bearer $ANON_KEY" \
              "$1"
          }
          URL="${BASE%/}/rest/v1/courses?select=id&limit=1"
          echo "Pinging Supabase (read-only anon SELECT)..."
          STATUS=$(probe "$URL")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Primary probe returned $STATUS; falling back to /auth/v1/settings"
            STATUS=$(probe "${BASE%/}/auth/v1/settings")
            echo "Fallback HTTP status: $STATUS"
          fi
          head -c 200 /tmp/resp.json || true
          echo ""
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "::error::Supabase keepalive failed with status $STATUS"
            exit 1
          fi
          echo "Keepalive OK."


      - name: Open alert issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Supabase keepalive failed (run ${context.runId})`,
              body: `The scheduled Supabase keepalive ping failed.\n\n` +
                    `Check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).\n\n` +
                    `If the project is paused, restore it from the Supabase dashboard.`,
              labels: ['supabase', 'keepalive'],
            });