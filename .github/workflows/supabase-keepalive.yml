name: Supabase Keepalive

# Prevents free-tier 7-day inactivity auto-pause by hitting the project
# with a harmless, RLS-independent read-only table read every 5 days.

on:
  schedule:
    - cron: '0 3 */5 * *'   # every 5 days at 03:00 UTC (max gap ~5 days, well inside 7-day window)
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # needed only to open/update an alert issue if the ping fails

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping Supabase (read-only health check)
    runs-on: ubuntu-latest
    steps:
      - name: Read-only keepalive query
        id: ping
        env:
          BASE: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          # Small, always-present, anon-readable table. Override via repo variable
          # if the table is ever renamed.
          TABLE: ${{ vars.SUPABASE_KEEPALIVE_TABLE || 'site_stats' }}
        run: |
          set -uo pipefail
          if [ -z "${BASE:-}" ] || [ -z "${ANON_KEY:-}" ]; then
            echo "::error::Missing SUPABASE_URL/VITE_SUPABASE_URL or SUPABASE_ANON_KEY/VITE_SUPABASE_ANON_KEY repo secret"
            exit 1
          fi

          # History of this check:
          #   1. /auth/v1/health      -> non-2xx for unauthenticated callers
          #   2. /rest/v1/ (OpenAPI)  -> 401 "Only secret API keys can be used
          #                              for this endpoint" after Supabase locked
          #                              the PostgREST root to secret keys
          # A plain single-row table read is the only form that both works with a
          # publishable/anon key and actually touches Postgres, which is what
          # resets the inactivity timer. Under RLS with no anon policy it still
          # returns 200 with [] — good enough, and never a false alarm.
          URL="${BASE%/}/rest/v1/${TABLE}?select=*&limit=1"
          STATUS=""
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}: reading ${TABLE} (read-only, limit 1)..."
            STATUS=$(curl -sS --max-time 20 -o /tmp/resp.json -w "%{http_code}" \
              -H "apikey: $ANON_KEY" \
              -H "Authorization: Bearer $ANON_KEY" \
              -H "Accept: application/json" \
              "$URL" || echo "000")
            echo "HTTP status: $STATUS"
            head -c 300 /tmp/resp.json 2>/dev/null || true
            echo ""
            case "$STATUS" in
              200|206)
                echo "Keepalive OK."
                exit 0
                ;;
              401|403)
                # Not transient: key rotated, or Supabase changed the endpoint
                # contract again. Fail fast with an actionable message.
                echo "::error::Supabase keepalive rejected the anon key (HTTP $STATUS). Check the SUPABASE_ANON_KEY secret and that '${TABLE}' is readable with a publishable key."
                exit 1
                ;;
              404)
                echo "::error::Table '${TABLE}' not found (HTTP 404). Set the SUPABASE_KEEPALIVE_TABLE repo variable to an existing anon-readable table."
                exit 1
                ;;
            esac
            echo "Transient response ($STATUS) — retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done

          echo "::error::Supabase keepalive failed after 3 attempts (last status $STATUS)"
          exit 1

      - name: Open or update alert issue on failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The scheduled Supabase keepalive ping failed.\n\n` +
              `Run: ${runUrl}\n\n` +
              `If the project is paused, restore it from the Supabase dashboard. ` +
              `If the log shows a 401/403, the anon key or the health-check endpoint needs updating.`;

            // Deduplicate: comment on the existing open alert instead of filing
            // a new issue every 5 days (this previously produced 12 duplicates).
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'keepalive',
              per_page: 1,
            });

            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Keepalive failed again (run ${context.runId}).\n\n${runUrl}`,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Supabase keepalive failed (run ${context.runId})`,
              body,
              labels: ['supabase', 'keepalive'],
            });
