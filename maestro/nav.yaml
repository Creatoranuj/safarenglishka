# Maestro navigation gate — runs AFTER login.yaml on the same booted emulator
# and the same app session (no clearState, no relaunch).
#
# Covers: bottom nav routes mount, session survives navigation, and the Play
# Store policy guardrail (Delete Account reachable from Settings).
appId: com.safarenglishka.app
androidWebViewHierarchy: devtools
---
# Assume we are already signed in (login.yaml ran first). Confirm before
# touching anything so a lost session fails here, not three steps later.
- extendedWaitUntil:
    visible: "Quick Actions|All Classes|No active courses|Continue where you left|Dashboard|Home|My Courses|Downloads|Profile"
    timeout: 60000

# 1) My Courses
- tapOn:
    id: "bottom-nav-my-courses"
    optional: true
- tapOn:
    text: "My Courses"
    optional: true
- extendedWaitUntil:
    visible: "My Courses|No active courses|Enrolled"
    timeout: 20000

# 2) Downloads — proves route mount + IndexedDB init
- tapOn:
    id: "bottom-nav-downloads"
    optional: true
- tapOn:
    text: "Downloads"
    optional: true
- extendedWaitUntil:
    visible: "Downloads|No downloads|Saved"
    timeout: 20000

# 3) Profile. Run #61 proved DOM ids are not exposed in the hierarchy the
# driver actually uses, so every id matcher gets a text fallback. Both rungs
# are optional; the assertions below are page-body-only copy, so a missed tap
# still fails loud (run #55's bug was asserting on the nav label instead).
#
# Run #65 failed here for 20s with NO signal about why: the header rendered
# but the body never did, because Profile.tsx sat on its skeleton forever
# when the auth profile cache was empty. The page now always resolves to
# loaded-or-error, so the gate is split into two steps that name the cause:
#   A — did the page resolve at all?  (nav / render)
#   B — did it resolve to real data?  (profile fetch)
- tapOn:
    id: "bottom-nav-profile"
    optional: true
- tapOn:
    text: "^Profile$"
    optional: true
# A) Failing HERE means nav or render, not data.
- extendedWaitUntil:
    visible: "Personal Information|Sign Out|Account Settings|Profile Unavailable"
    timeout: 20000
# B) Failing HERE means the profile fetch returned nothing for the test
#    account — check the `profiles` row, not the emulator.
- assertNotVisible: "Profile Unavailable"
- assertVisible: "Personal Information|Sign Out"

# 4) Settings → Delete Account (Play Store account-deletion policy)
- tapOn:
    id: "profile-settings"
    optional: true
- tapOn:
    text: "^Settings$"
    optional: true
- extendedWaitUntil:
    visible: "Delete Account|Delete my account|Account Settings"
    timeout: 20000


# 5) Hardware back → exit hint (regression guard for useAndroidBackButton)
- pressKey: Back
- pressKey: Back
- extendedWaitUntil:
    visible: "Press back again to exit"
    timeout: 4000
    optional: true
