# Maestro smoke — the release gate. Composition only.
#
# The actual steps live in two focused gates so a failure names its own class
# in the job log instead of everything looking like "dashboard token missing":
#   login.yaml → cold start, landing, credentials, dashboard first paint
#   nav.yaml   → bottom nav routes, session persistence, settings guardrail
#
# Run locally:
#   maestro test maestro/smoke.yaml --env MAESTRO_EMAIL=... --env MAESTRO_PASSWORD=...
# NEVER hardcode credentials here — this file is committed.
appId: com.safarenglishka.app
# DOM traversal, not the Android accessibility tree — see login.yaml for the
# full reasoning (empty `root` node → screenshot fallback → null on API 33).
androidWebViewHierarchy: devtools
---
- runFlow: login.yaml
- runFlow: nav.yaml
